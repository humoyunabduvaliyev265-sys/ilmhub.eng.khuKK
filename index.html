<html lang="en">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="Interactive English-learning platform by Khumoyun with A1–C2 levels, vocabulary flashcards, grammar lessons, listening & speaking, rigorous test engine, and administrative student management." />
    <meta property="og:title" content="ILMHUB ENGLISH by KHUMOYUN" />
    <meta property="og:description" content="Interactive English-learning platform by Khumoyun with A1–C2 levels, vocabulary flashcards, grammar lessons, listening & speaking, rigorous test engine, and administrative student management." />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('ilmhub_english_theme') || localStorage.getItem('ilmhub_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="font-sans antialiased selection:bg-blue-500 selection:text-white bg-slate-50 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
